<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stereo 3D Demo (Phase 2 · SBS 自由立体)</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; height: 100%; background: #000; color: #ddd;
               font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; overflow: hidden; }
  #scene { position: fixed; inset: 0; }

  /* 极简顶栏 — 只在 mono 模式可见；cross 立体模式自动隐藏避免干扰合成 */
  #topbar { position: fixed; top: 0; left: 0; right: 0; height: 44px; padding: 0 16px;
            display: flex; align-items: center; gap: 14px; font-size: 12px;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255,255,255,0.06); z-index: 100;
            transition: opacity 0.2s; }
  #topbar.stereo-hidden { opacity: 0.12; }   /* cross 模式下淡到几乎隐形 */
  #topbar:hover { opacity: 1.0; }            /* 鼠标 hover 临时显示 */
  #topbar .stat { color: #888; }
  #topbar .stat b { color: #ddd; margin-left: 4px; font-weight: 500; }
  #topbar .mode-badge { color: #6cf; font-weight: 600; padding: 4px 10px;
                        background: rgba(108,204,255,0.12); border-radius: 4px; }
  #topbar button { padding: 6px 14px; background: #6cf; color: #000; border: none;
                   border-radius: 5px; font-weight: 600; cursor: pointer; font-size: 12px; }
  #topbar button.ghost { background: transparent; color: #888; border: 1px solid #333; }
  #topbar .spacer { flex: 1; }

  /* 中央 SBS 分隔线 + 对齐点 — 仅 cross 模式可见 */
  #divider, .dot { display: none; }
  body.cross #divider { display: block; position: fixed; top: 0; bottom: 0; left: 50%;
                        width: 1px; background: rgba(108, 204, 255, 0.18);
                        pointer-events: none; z-index: 50; }
  body.cross .dot { display: block; position: fixed; top: 50%; width: 6px; height: 6px;
                    margin-top: -3px; border-radius: 50%; background: #6cf;
                    box-shadow: 0 0 8px rgba(108,204,255,0.7);
                    pointer-events: none; z-index: 51; }
  body.cross #dotL { left: calc(25% - 3px); }
  body.cross #dotR { left: calc(75% - 3px); }

  /* 摄像头小窗 — cross 模式下移到正下方居中，避免影响立体合成 */
  #cam { position: fixed; bottom: 12px; right: 12px; width: 180px; height: 100px;
         border: 1px solid #333; border-radius: 6px; background:#111;
         transform: scaleX(-1); z-index: 90; opacity: 0.5; transition: opacity 0.2s; }
  #cam:hover { opacity: 1.0; }

  #startBtn { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
              padding: 14px 28px; font-size: 16px; background: #6cf; color:#000;
              border: none; border-radius: 8px; cursor: pointer; font-weight: 600;
              z-index: 200; }
  #startBtn:disabled { opacity: 0.5; cursor: progress; }
  #err { position: fixed; bottom: 12px; left: 12px; color: #f66; font-size: 12px; max-width: 50%; z-index: 300; }

  /* expert 模式才显示的详细标定面板 */
  #expertPanel { position: fixed; top: 56px; left: 12px; padding: 10px 12px;
                 background: rgba(0,0,0,0.6); border: 1px solid #333; border-radius: 8px;
                 font-size: 11px; line-height: 1.5; backdrop-filter: blur(6px);
                 max-width: 280px; z-index: 99; display: none; }
  body.expert #expertPanel { display: block; }
  #expertPanel .row { display: flex; justify-content: space-between; gap: 12px; }
  #expertPanel .row span:first-child { color: #888; }
  #expertPanel code { background: #222; padding: 1px 5px; border-radius: 3px; color: #6cf; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="divider"></div>
<div id="dotL" class="dot"></div>
<div id="dotR" class="dot"></div>
<video id="cam" autoplay playsinline muted></video>

<!-- 极简顶栏：模式徽章 + 一个切换按钮 + 零位 + 关键状态 -->
<div id="topbar" hidden>
  <span class="mode-badge" id="vMode">单画面</span>
  <button id="modeBtn">切到斗鸡眼立体</button>
  <button id="recenterBtn" class="ghost">📍 零位（空格）</button>
  <div class="spacer"></div>
  <span class="stat">距离 <b id="dist">—</b></span>
  <span class="stat">FPS <b id="fps">—</b></span>
  <span class="stat" id="faceStat">脸 <b id="face">—</b></span>
</div>

<!-- 隐藏的详细字段，给 JS 用但不显示给普通用户 -->
<div style="display:none">
  <span id="head"></span><span id="ipd"></span>
  <span id="vFov"></span><span id="vIpd"></span><span id="vCamY"></span><span id="vOffset"></span><span id="vScale"></span>
</div>

<!-- expert 模式（?expert=1）才显示的详细标定面板 -->
<div id="expertPanel">
  <div style="font-weight:600;color:#6cf;margin-bottom:6px">Expert 标定</div>
  <div class="row"><span>FoV (°)</span><span id="vFov2">—</span></div>
  <div class="row"><span>IPD (mm)</span><span id="vIpd2">—</span></div>
  <div class="row"><span>Cam Y (mm)</span><span id="vCamY2">—</span></div>
  <div class="row"><span>零位 (x, y)</span><span id="vOffset2">—</span></div>
  <div class="row"><span>Stereo scale</span><span id="vScale2">—</span></div>
  <div style="margin-top:6px;color:#666">
    <code>S</code> 模式切换 · <code>Space</code> 零位<br/>
    <code>,</code>/<code>.</code> 立体强度 · <code>[</code>/<code>]</code> FoV<br/>
    <code>-</code>/<code>=</code> IPD · <code>;</code>/<code>'</code> Cam Y · <code>R</code> 重置
  </div>
</div>
<button id="startBtn">点击开始（授权摄像头）</button>
<div id="err"></div>

<script>
// ====== 在 module 加载前先装好全局错误兜底（不依赖 module 是否成功）======
(function () {
  const errEl = document.getElementById('err');
  function show(msg) {
    if (errEl) {
      errEl.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;max-width:none;padding:12px;background:#411;border:1px solid #f66;border-radius:6px;color:#f99;font-size:13px;font-family:monospace;white-space:pre-wrap;z-index:9999';
      errEl.textContent = (errEl.textContent ? errEl.textContent + '\n' : '') + msg;
    } else {
      // err div 还没渲染：写到 body 末尾
      const d = document.createElement('pre');
      d.style.cssText = 'position:fixed;bottom:0;left:0;right:0;padding:8px;background:#411;color:#f99;font:12px monospace;z-index:9999';
      d.textContent = msg;
      document.body && document.body.appendChild(d);
    }
  }
  window.addEventListener('error', e => show('[ERROR] ' + e.message + '\n  at ' + (e.filename||'?') + ':' + (e.lineno||'?')));
  window.addEventListener('unhandledrejection', e => show('[PROMISE] ' + (e.reason && (e.reason.stack || e.reason.message || String(e.reason)))));
  // Safari 版本检测
  const ua = navigator.userAgent;
  const isSafari = /Safari\//.test(ua) && !/Chrome\/|Chromium\//.test(ua);
  const m = ua.match(/Version\/(\d+\.\d+)/);
  if (isSafari && m) {
    const v = parseFloat(m[1]);
    if (v < 16.4) show('Safari ' + v + ' 对 ES module 兼容可能不全；建议用 Chrome 打开 http://localhost:8765');
  }
})();
</script>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
import { FilesetResolver, FaceLandmarker } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';

// ===== 物理常量（MacBook 13~14 寸假设；首次粗略，后面提供标定面板可调）=====
const PHYS = {
  ipdMm: 63,                   // 人群均值瞳距
  screenWmm: 300,              // 屏幕物理宽 ~30cm (13"~14")
  screenHmm: 190,              // 屏幕物理高
  // camOffsetYmm 含义：摄像头视野中央对应的"用户眼睛在屏幕系的 Y 高度"。
  // 摄像头机械位置确实在屏幕中心上方 ~105mm，但用户实际坐姿眼睛通常在
  // 屏幕中央到中下，所以脸出现在摄像头视野中央时，"眼睛-屏幕中心"垂直差远小于 105。
  // 经验值 ~50mm 更贴近 MacBook 实际使用姿态（可用 ; ' 微调）
  camOffsetXmm: 0,
  camOffsetYmm: 50,
  // MacBook 摄像头水平 FoV 大约 55°（年代不一，可标定）
  camHFovDeg: 55,
};

// ===== Three.js 场景 =====
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;     // 软阴影（PCF 多采样滤波）
renderer.toneMapping = THREE.ACESFilmicToneMapping;   // 让多光照叠加不爆白
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0e16);
// 雾配合拉远的 cubes：远端 2.5m，避免后墙完全雾化但保留深度暗示
scene.fog = new THREE.Fog(0x0a0e16, 700, 2500);

// ===== 灯光：环境基底 + 半球 + 三向包围（key/fill/rim），主光投柔和阴影 =====
// 环境光降一点，让阴影对比明显；总照度由后面 4 盏方向光补足
scene.add(new THREE.AmbientLight(0xffffff, 0.45));
const hemi = new THREE.HemisphereLight(0xc6d4ff, 0x4a3a30, 0.7);
scene.add(hemi);

// Key light：从右上前方打来，承担主要照明 + 投阴影
const key = new THREE.DirectionalLight(0xfff5e6, 1.5);
key.position.set(180, 320, 280);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);              // 高分辨率 shadow map
key.shadow.radius = 6;                            // PCF 模糊半径，越大越柔
key.shadow.bias = -0.0005;                        // 防 shadow acne
key.shadow.normalBias = 1.0;
// 配置 shadow camera 覆盖整个 floor + cubes 区域
const sc = key.shadow.camera;
sc.left = -450; sc.right = 450;
sc.top = 450; sc.bottom = -450;
sc.near = 50; sc.far = 1200;
sc.updateProjectionMatrix();
scene.add(key);

// Fill light：从左前方补暖色，软化阴影
const fill = new THREE.DirectionalLight(0xb8d4ff, 0.85);
fill.position.set(-220, 120, 200);
scene.add(fill);

// Rim light：从后方打轮廓光，cubes 边缘有微微高光，分离前后景
const rim = new THREE.DirectionalLight(0xfff0d0, 0.55);
rim.position.set(0, 180, -300);
scene.add(rim);

// 屏幕几何中心 = 世界原点；+x 右，+y 上，+z 朝用户（屏幕前方）
// 在屏幕"后方"（-z）摆一些参照立方体，让"窗户内有深度的房间"的感觉成立
const group = new THREE.Group();
scene.add(group);

// 房间地板（颜色加亮 + grid，避免在 fog 中消失）
const matFloor = new THREE.MeshStandardMaterial({ color: 0x2a3340, roughness: 0.9 });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(900, 900), matFloor);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -PHYS.screenHmm / 2;
floor.receiveShadow = true;
group.add(floor);

const floorGrid = new THREE.GridHelper(900, 30, 0x4a5868, 0x2f3a48);
floorGrid.position.y = -PHYS.screenHmm / 2 + 0.5;
group.add(floorGrid);

// 后墙拉到更远，让 cubes 有"飘在房间里"的空间
const matWall = new THREE.MeshStandardMaterial({ color: 0x0d1018, roughness: 1.0 });
const backWall = new THREE.Mesh(new THREE.PlaneGeometry(900, 700), matWall);
backWall.position.z = -650;
backWall.position.y = 50;
backWall.receiveShadow = true;
group.add(backWall);

// 后墙参考网格（让深度感更明确）
const wallGrid = new THREE.GridHelper(900, 18, 0x1f2838, 0x141820);
wallGrid.rotation.x = Math.PI / 2;
wallGrid.position.z = -649;
wallGrid.position.y = 50;
group.add(wallGrid);

// SBS 立体感强化：cubes 跨越屏幕平面（z=0）前后分布，
// 前方"飘出"的 cube 和后方"凹进"的 cube 产生强烈相对视差对比
const cubes = [];
const palette = [0x6cf0ff, 0xff6f91, 0xffd166, 0x90ee90, 0xc792ea];
const SCENE_Y_CENTER = 30;
const CUBE_LAYOUT = [
  // [x, y, z, size_factor] — 手工布局让视差对比最强
  // 屏幕前方（z>0）"飘出"层
  [ -80, 20,   80, 1.0],  [  90, -20,  120, 0.9],  [   0, 60,  60, 0.7],
  // 屏幕平面附近（z≈0）锚定层
  [-150, 40,  -20, 1.1],  [ 140, 50,  -40, 1.0],  [ -40, -30, -10, 0.9],
  // 屏幕后方"凹进"层（远~中远）
  [  60, 80,  -180, 1.2], [-120, -10, -200, 1.0], [ 100, -30, -250, 1.1],
  [-180, 70,  -320, 1.0], [ 170, 30,  -340, 0.9], [ -60, 100, -380, 1.0],
  // 远景墙前
  [ 130, -50, -480, 1.3], [-100, 60,  -520, 1.1], [   0, -40, -560, 1.2],
];
for (let i = 0; i < CUBE_LAYOUT.length; i++) {
  const [x, y, z, sf] = CUBE_LAYOUT[i];
  const size = 50 * sf;
  const geo = new THREE.BoxGeometry(size, size, size);
  const mat = new THREE.MeshStandardMaterial({
    color: palette[i % palette.length],
    metalness: 0.1, roughness: 0.55,
    emissive: palette[i % palette.length], emissiveIntensity: 0.08,
  });
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true; m.receiveShadow = true;
  m.position.set(x, SCENE_Y_CENTER + y, z);
  m.userData.spin = (Math.random() - 0.5) * 0.003;
  group.add(m);
  cubes.push(m);
}

// "窗框"——完整屏幕矩形（两个相机看的同一 stage）
const frameMat = new THREE.LineBasicMaterial({ color: 0x6cf });
const w = PHYS.screenWmm / 2, h = PHYS.screenHmm / 2;   // 屏幕半宽/半高
const frame = new THREE.LineLoop(
  new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(-w, -h, 0),
    new THREE.Vector3( w, -h, 0),
    new THREE.Vector3( w,  h, 0),
    new THREE.Vector3(-w,  h, 0),
  ]),
  frameMat,
);
scene.add(frame);

// ===== 双目相机：左右眼各一个，独立 off-axis frustum =====
// Gemini 评审 P0：必须关 projectionMatrixAutoUpdate，否则 Three.js 每帧用 fov/aspect 覆盖
function makeCam() {
  const c = new THREE.PerspectiveCamera(60, 1, 1, 3000);
  c.projectionMatrixAutoUpdate = false;
  c.rotation.set(0, 0, 0);
  return c;
}
const cameraL = makeCam();   // 左眼物理位置
const cameraR = makeCam();   // 右眼物理位置
scene.add(cameraL);
scene.add(cameraR);

/** Off-axis frustum 对着"完整屏幕矩形" (-w,-h)..(w,h)
 *  Half-SBS 标准范式：两个相机都看同一个 stage，间距 = IPD，
 *  各自 viewport 显示该相机视野的完整场景（横向压扁 50%，但两个画面是
 *  同一场景的不同视角，视差即立体感来源）。
 */
function setOffAxisStage(camera, eye, near, far) {
  const n = near;
  const left   = (-w - eye.ex) * n / eye.ez;
  const right  = ( w - eye.ex) * n / eye.ez;
  const bottom = (-h - eye.ey) * n / eye.ez;
  const top    = ( h - eye.ey) * n / eye.ez;
  camera.projectionMatrix.makePerspective(left, right, top, bottom, n, far);
  camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
  camera.position.set(eye.ex, eye.ey, eye.ez);
}

function onResize() {
  const wPx = window.innerWidth, hPx = window.innerHeight;
  renderer.setSize(wPx, hPx, false);
}
window.addEventListener('resize', onResize);
onResize();

// ===== MediaPipe Face Landmarker =====
let landmarker = null;
async function initLandmarker() {
  const vision = await FilesetResolver.forVisionTasks(
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
  );
  landmarker = await FaceLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
      delegate: 'GPU',
    },
    runningMode: 'VIDEO',
    numFaces: 1,
    outputFaceBlendshapes: false,
    outputFacialTransformationMatrixes: false,
  });
}

// ===== 摄像头 =====
const video = document.getElementById('cam');
async function initCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { width: 640, height: 480, facingMode: 'user' },
    audio: false,
  });
  video.srcObject = stream;
  await new Promise(r => video.addEventListener('loadeddata', r, { once: true }));
}

// ===== OneEuro filter 给头位平滑 =====
class OneEuro {
  constructor(mincutoff = 1.0, beta = 0.05, dcutoff = 1.0) {
    this.mincutoff = mincutoff; this.beta = beta; this.dcutoff = dcutoff;
    this.x_prev = null; this.dx_prev = 0; this.t_prev = 0;
  }
  alpha(cutoff, dt) {
    const tau = 1 / (2 * Math.PI * cutoff);
    return 1 / (1 + tau / dt);
  }
  filter(x, t) {
    if (this.x_prev === null) { this.x_prev = x; this.t_prev = t; return x; }
    const dt = Math.max((t - this.t_prev) / 1000, 1e-3);
    const dx = (x - this.x_prev) / dt;
    const a_d = this.alpha(this.dcutoff, dt);
    const dx_hat = a_d * dx + (1 - a_d) * this.dx_prev;
    const cutoff = this.mincutoff + this.beta * Math.abs(dx_hat);
    const a = this.alpha(cutoff, dt);
    const x_hat = a * x + (1 - a) * this.x_prev;
    this.x_prev = x_hat; this.dx_prev = dx_hat; this.t_prev = t;
    return x_hat;
  }
}
const fX = new OneEuro(1.0, 0.05);
const fY = new OneEuro(1.0, 0.05);
const fZ = new OneEuro(0.6, 0.02);

// ===== 头位估计 =====
// MediaPipe Face Landmarker 468 点：左瞳 468，右瞳 473（refine_landmarks 才有）；
// 不依赖 iris 时，用左眼外角 33、右眼外角 263 当近似双瞳水平外缘——但更稳的是用左眼 468/473（在 v0.10 task model 内置）。
// 这里我们用 left eye center ~ avg(33,133)；right eye center ~ avg(362,263)。
const LEFT_EYE_OUT = 33, LEFT_EYE_IN = 133;
const RIGHT_EYE_OUT = 263, RIGHT_EYE_IN = 362;

function estimateHeadFromLandmarks(lm, videoW, videoH) {
  // landmarks 是归一化 [0,1] 视频坐标，x 已经是镜像后用户视角？——MediaPipe 输出是相对原视频帧的正向坐标，不镜像。
  const lx = (lm[LEFT_EYE_OUT].x + lm[LEFT_EYE_IN].x) / 2 * videoW;
  const ly = (lm[LEFT_EYE_OUT].y + lm[LEFT_EYE_IN].y) / 2 * videoH;
  const rx = (lm[RIGHT_EYE_OUT].x + lm[RIGHT_EYE_IN].x) / 2 * videoW;
  const ry = (lm[RIGHT_EYE_OUT].y + lm[RIGHT_EYE_IN].y) / 2 * videoH;

  const ipdPx = Math.hypot(rx - lx, ry - ly);
  // 摄像头水平 FoV
  const fovH = PHYS.camHFovDeg * Math.PI / 180;
  // 焦距（像素）：fx = (W/2) / tan(fovH/2)
  const fx = (videoW / 2) / Math.tan(fovH / 2);
  // 头到摄像头距离：z_cam = fx * IPD_real / IPD_px
  const z_cam_mm = fx * PHYS.ipdMm / ipdPx;

  // 双眼中点像素 → 摄像头系 3D（+x 右、+y 上、+z 朝用户）
  const cx_px = (lx + rx) / 2;
  const cy_px = (ly + ry) / 2;
  // 像素中心化（MediaPipe 视频是非镜像；用户左眼在帧右侧；我们要"用户视角"右为 +x，所以 x 取反）
  const dx_px = cx_px - videoW / 2;
  const dy_px = cy_px - videoH / 2;
  const x_cam_mm = -dx_px * z_cam_mm / fx;   // 取反：镜像到用户视角
  const y_cam_mm = -dy_px * z_cam_mm / fx;   // 像素 y 向下，世界 y 向上

  // 摄像头系 → 屏幕系：屏幕中心是世界原点，摄像头在 (camOffsetX, camOffsetY, 0)
  const ex = x_cam_mm + PHYS.camOffsetXmm;
  const ey = y_cam_mm + PHYS.camOffsetYmm;
  const ez = z_cam_mm;     // 摄像头到屏幕平面 z 偏移忽略（量级在 cm，相对 50cm 工作距离可接受）
  return { ex, ey, ez, ipdPx };
}

// ===== 主循环 =====
let lastVideoTime = -1;
let fpsAcc = 0, fpsN = 0, fpsT0 = performance.now();
const hud = {
  fps: document.getElementById('fps'),
  head: document.getElementById('head'),
  dist: document.getElementById('dist'),
  ipd: document.getElementById('ipd'),
  face: document.getElementById('face'),
  vFov: document.getElementById('vFov'),
  vIpd: document.getElementById('vIpd'),
  vCamY: document.getElementById('vCamY'),
  vOffset: document.getElementById('vOffset'),
  vMode: document.getElementById('vMode'),
  vScale: document.getElementById('vScale'),
};
function refreshCalibHud() {
  const fov = PHYS.camHFovDeg.toFixed(0);
  const ipd = PHYS.ipdMm.toFixed(0);
  const camY = PHYS.camOffsetYmm.toFixed(0);
  const off = `${eyeOffset.ex.toFixed(0)}, ${eyeOffset.ey.toFixed(0)}`;
  const sc = stereoScale.toFixed(1);
  // expert panel
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  set('vFov2', fov); set('vIpd2', ipd); set('vCamY2', camY); set('vOffset2', off); set('vScale2', sc);
  // 隐藏的兼容 fields（cc 调试用）
  set('vFov', fov); set('vIpd', ipd); set('vCamY', camY); set('vOffset', off); set('vScale', sc);
}

// ===== 键盘标定 =====
const PHYS_DEFAULT = JSON.parse(JSON.stringify(PHYS));
window.addEventListener('keydown', e => {
  switch (e.key) {
    case '[': PHYS.camHFovDeg = Math.max(30, PHYS.camHFovDeg - 1); break;
    case ']': PHYS.camHFovDeg = Math.min(110, PHYS.camHFovDeg + 1); break;
    case '-': PHYS.ipdMm = Math.max(50, PHYS.ipdMm - 1); break;
    case '=': PHYS.ipdMm = Math.min(80, PHYS.ipdMm + 1); break;
    case ';': PHYS.camOffsetYmm -= 5; break;
    case "'": PHYS.camOffsetYmm += 5; break;
    case 'r': case 'R': Object.assign(PHYS, PHYS_DEFAULT); eyeOffset.ex = 0; eyeOffset.ey = 0; setStereoMode('mono'); stereoScale = 1.5; break;
    case ' ': recenter(); e.preventDefault(); break;
    // Stereo 模式切换（mono ↔ cross）
    case 's': case 'S': setStereoMode(stereoMode === 'cross' ? 'mono' : 'cross'); break;
    // 立体强度（expert 用，普通用户不需要）
    case ',': stereoScale = Math.max(0.0, stereoScale - 0.1); break;
    case '.': stereoScale = Math.min(3.0, stereoScale + 0.1); break;
    default: return;
  }
  refreshCalibHud();
});

// ===== 零位校准（解决摄像头水平偏置 + 用户坐姿不对称）=====
// 按 Space 或点击按钮：把当前帧 head 位置记为新零点；之后 eye = rawHead - eyeOffset
const eyeOffset = { ex: 0, ey: 0 };
let lastRawHead = null;   // 上一帧未减 offset 的原始头位
function recenter() {
  if (lastRawHead) {
    eyeOffset.ex = lastRawHead.ex;
    eyeOffset.ey = lastRawHead.ey;
    // 重置 OneEuro 滤波器内部状态，避免新零位被旧值拖拽
    fX.x_prev = null; fX.dx_prev = 0;
    fY.x_prev = null; fY.dx_prev = 0;
    refreshCalibHud();
  }
}
// 按钮 click 直接绑（DOM 已就绪，type=module 默认 defer）
document.getElementById('recenterBtn')?.addEventListener('click', recenter);
document.getElementById('modeBtn')?.addEventListener('click', () => {
  setStereoMode(stereoMode === 'cross' ? 'mono' : 'cross');
});

// expert 模式 URL 参数：?expert=1 显示详细标定面板
if (new URLSearchParams(location.search).get('expert') === '1') {
  document.body.classList.add('expert');
}


// ===== 丢失保护 =====
let lostFrames = 0;
const LOST_THRESHOLD = 8;
let lastIpdPx = null;
const IPD_JUMP_RATIO = 0.5;

// 头部中心（屏幕正前方 50cm 默认）。左右眼位置由 head ± IPD/2 推出。
let eye = { ex: 0, ey: 0, ez: 500 };

// ===== Stereo 渲染参数 =====
// 简化为两个模式：'mono' 单画面（Phase 1 motion parallax）/ 'cross' 斗鸡眼立体
// 立体强度固定 1.5（实测最强又不过头），expert 模式（?expert=1）可调
let stereoMode = 'mono';
let stereoScale = 2.5;   // 实测：1.5 视差太弱看不出，2.5 立体感明显且仍可合成

function setStereoMode(m) {
  stereoMode = m;
  document.body.classList.toggle('cross', m === 'cross');
  const btn = document.getElementById('modeBtn');
  const badge = document.getElementById('vMode');
  if (btn) btn.textContent = m === 'cross' ? '切回单画面' : '切到斗鸡眼立体';
  if (badge) badge.textContent = m === 'cross' ? '斗鸡眼立体' : '单画面';
  refreshCalibHud();
}

function renderStereo() {
  const W = renderer.domElement.width / renderer.getPixelRatio();
  const H = renderer.domElement.height / renderer.getPixelRatio();
  const halfW = W / 2;

  const sep = (PHYS.ipdMm * stereoScale) / 2;
  const leftEye  = { ex: eye.ex - sep, ey: eye.ey, ez: eye.ez };
  const rightEye = { ex: eye.ex + sep, ey: eye.ey, ez: eye.ez };

  renderer.autoClear = false;
  renderer.clear();
  renderer.setScissorTest(true);

  if (stereoMode === 'mono') {
    // 单画面：单相机看整屏，铺满 canvas
    setOffAxisStage(cameraL, eye, 50, 3000);
    renderer.setViewport(0, 0, W, H);
    renderer.setScissor(0, 0, W, H);
    renderer.render(scene, cameraL);
    renderer.setScissorTest(false);
    return;
  }

  // SBS cross-eyed：两个相机都看完整 stage，只是位置 IPD 间距 → 视角略不同（即视差）
  setOffAxisStage(cameraL, leftEye,  50, 3000);
  setOffAxisStage(cameraR, rightEye, 50, 3000);

  // 屏幕左半 viewport（cross-eyed: 给右眼看 → cameraR 的视图）
  const leftViewportCam  = (stereoMode === 'cross') ? cameraR : cameraL;
  renderer.setViewport(0, 0, halfW, H);
  renderer.setScissor(0, 0, halfW, H);
  renderer.render(scene, leftViewportCam);

  // 屏幕右半 viewport（cross-eyed: 给左眼看 → cameraL 的视图）
  const rightViewportCam = (stereoMode === 'cross') ? cameraL : cameraR;
  renderer.setViewport(halfW, 0, halfW, H);
  renderer.setScissor(halfW, 0, halfW, H);
  renderer.render(scene, rightViewportCam);

  renderer.setScissorTest(false);
}

function loop() {
  const tNow = performance.now();
  let detected = false;
  if (landmarker && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const res = landmarker.detectForVideo(video, tNow);
    if (res.faceLandmarks && res.faceLandmarks.length > 0) {
      const head = estimateHeadFromLandmarks(
        res.faceLandmarks[0], video.videoWidth, video.videoHeight,
      );
      // IPD 突变保护：转头 / 遮挡 / 误识时丢一帧
      let accept = true;
      if (lastIpdPx !== null) {
        const ratio = Math.abs(head.ipdPx - lastIpdPx) / lastIpdPx;
        if (ratio > IPD_JUMP_RATIO) accept = false;
      }
      if (accept) {
        lastRawHead = { ex: head.ex, ey: head.ey, ez: head.ez };
        // 应用零位校准偏移：x/y 减 offset，z 不动（距离是绝对值）
        eye.ex = fX.filter(head.ex - eyeOffset.ex, tNow);
        eye.ey = fY.filter(head.ey - eyeOffset.ey, tNow);
        eye.ez = fZ.filter(head.ez, tNow);
        lastIpdPx = head.ipdPx;
        lostFrames = 0;
        detected = true;
      } else {
        lostFrames++;
      }
      hud.ipd.textContent = head.ipdPx.toFixed(1);
    } else {
      lostFrames++;
    }
    // 长时间丢失 → 软重置：让下一次检测重新作为基线，避免冻结画面
    if (lostFrames > LOST_THRESHOLD * 4) lastIpdPx = null;
  }

  // 自旋
  for (const c of cubes) c.rotation.y += c.userData.spin;

  // Gemini 评审 P0：手动 projectionMatrix 后 Three.js frustum culling 会误判 → 边缘物体莫名消失。
  scene.traverse(o => { if (o.isMesh && o.frustumCulled) o.frustumCulled = false; });

  renderStereo();

  // FPS
  fpsAcc++;
  if (tNow - fpsT0 > 500) {
    const fps = fpsAcc * 1000 / (tNow - fpsT0);
    hud.fps.textContent = fps.toFixed(0);
    fpsAcc = 0; fpsT0 = tNow;
  }
  hud.head.textContent =
    `${(eye.ex/10).toFixed(1)}, ${(eye.ey/10).toFixed(1)}, ${(eye.ez/10).toFixed(1)}`;
  hud.dist.textContent = `${(eye.ez/10).toFixed(1)} cm`;
  hud.face.textContent = detected ? '✓' : '—';

  requestAnimationFrame(loop);
}

// ===== Debug 钩子：让 ?debug=1 跳过摄像头，用 eye 默认值直接渲染（cc 离线验证用）=====
window.__demo = {
  setEye(ex, ey, ez) { eye.ex = ex; eye.ey = ey; eye.ez = ez; },
  getEye() { return { ...eye }; },
  recenter,
  startNoCam() {
    document.getElementById('startBtn')?.remove();
    document.getElementById('topbar').hidden = false;
    refreshCalibHud();
    loop();
  },
  /** 手动渲染一帧（用于 headless preview）*/
  tick() {
    scene.traverse(o => { if (o.isMesh && o.frustumCulled) o.frustumCulled = false; });
    renderStereo();
    return { sceneChildren: scene.children.length, eye: { ...eye }, stereoMode, stereoScale };
  },
  setStereoMode(m) { stereoMode = m; },
  setStereoScale(s) { stereoScale = s; },
  /** Debug: 返回相机状态 */
  inspect() {
    return {
      camL: { pos: cameraL.position.toArray().map(v=>v.toFixed(1)) },
      camR: { pos: cameraR.position.toArray().map(v=>v.toFixed(1)) },
      camLProj: Array.from(cameraL.projectionMatrix.elements).map(v => v.toFixed(3)),
      camRProj: Array.from(cameraR.projectionMatrix.elements).map(v => v.toFixed(3)),
      stereoScale,
      ipdMm: PHYS.ipdMm,
      sep: PHYS.ipdMm * stereoScale / 2,
    };
  },
  PHYS,
};
if (new URLSearchParams(location.search).get('debug') === '1') {
  window.addEventListener('DOMContentLoaded', () => window.__demo.startNoCam());
}

// ===== 启动 =====
const startBtn = document.getElementById('startBtn');
const errEl = document.getElementById('err');
startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  startBtn.textContent = '加载模型中...';
  try {
    await initCamera();
    await initLandmarker();
    startBtn.remove();
    document.getElementById('topbar').hidden = false;
    refreshCalibHud();
    loop();
  } catch (e) {
    console.error(e);
    errEl.textContent = '启动失败: ' + (e.message || e);
    startBtn.disabled = false;
    startBtn.textContent = '重试';
  }
});
</script>
</body>
</html>
